<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="將五個以上同色球連成一線的益智遊戲 Color Lines"
  />
  <meta name="theme-color" content="#241052" />
  <title>Color Lines</title>
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./assets/icons/favicon-32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./assets/icons/icon-512.png"
  />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Color Lines" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app">
    <section class="panel" aria-label="Color Lines 遊戲">
      <div class="game-layout">
        <div class="board-wrap">
          <div id="board" aria-label="遊戲盤"></div>
        </div>

        <aside class="sidebar">
          <div class="topbar">
            <div class="next-area">
              <div class="label">下回</div>
              <div id="nextBalls" class="next-balls"></div>
            </div>

            <div class="score-box">
              <div class="label">分數</div>
              <div id="score" class="score">0</div>
            </div>

            <div class="score-box right">
              <div class="label">最高</div>
              <div id="best" class="score">0</div>
            </div>
          </div>

          <div class="items-area" aria-label="遊戲道具">
            <div class="items-heading">
              <div class="label">道具</div>
              <div id="itemHint" class="item-hint" aria-live="polite">每局限量使用</div>
            </div>
            <div id="itemButtons" class="item-buttons"></div>
          </div>

          <div class="controls">
            <button id="restartButton" type="button">重新開始</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="gameOver" class="game-over" role="dialog" aria-modal="true">
    <div class="game-over-card">
      <div class="label">遊戲結束</div>
      <h2>再來一局？</h2>
      <div id="finalScore" class="final-score">0</div>
      <button id="gameOverRestart" class="primary" type="button">再玩一次</button>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/layout.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
