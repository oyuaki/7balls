<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Line up 5 or more balls of the same color."
  />
  <meta name="theme-color" content="#241052" />
  <title>Color Lines</title>
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./assets/icons/favicon-32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./assets/icons/icon-512.png"
  />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Color Lines" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app">
    <section class="panel" aria-label="Color Lines">
      <div class="game-layout">
        <div class="board-wrap">
          <div id="board" aria-label="Board"></div>
        </div>

        <aside class="sidebar">
          <div class="topbar">
            <div class="next-area">
              <div class="label">NEXT</div>
              <div id="nextBalls" class="next-balls"></div>
            </div>

            <div class="score-box">
              <div class="label">SCORE</div>
              <div id="score" class="score">0</div>
            </div>

            <div class="score-box right">
              <div class="label">BEST</div>
              <div id="best" class="score">0</div>
            </div>
          </div>

          <div class="controls">
            <button id="undoButton" class="icon-button undo-button" type="button" title="Undo" aria-label="Undo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>
            <button id="restartButton" class="icon-button restart-button" type="button" title="Restart" aria-label="Restart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="gameOver" class="game-over" role="dialog" aria-modal="true">
    <div class="game-over-card">
      <h2>GAME OVER</h2>
      <div id="finalScore" class="final-score">0</div>
      <button id="gameOverRestart" class="primary icon-button" type="button" title="Play again" aria-label="Play again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/layout.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
